name: LimiTests

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  unit-tests:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Run LimiTests
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace Limi.xcworkspace \
            -scheme Limi \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -only-testing:LimiTests \
            CODE_SIGNING_ALLOWED=NO
